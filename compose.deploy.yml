# EC2에서 Docker 이미지를 어떻게 실행할지 정하는 파일

#  ECR의 백엔드 이미지 선택
#  prod 환경 활성화
#  EC2의 비밀 환경변수 전달
#  EC2의 80번 포트를 Spring Boot 8080번 포트에 연결
#  서버가 꺼지면 컨테이너 재시작

services:
  backend:
    image: ${IMAGE_URI:?IMAGE_URI must be set}
    container_name: mulmi-backend
    restart: unless-stopped
    env_file:
      - path: /opt/mulmi/backend.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Development RDS has no migration history yet. Replace with migrations before production.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # 컨테이너 기본 시간대(UTC)를 한국으로 : JPA가 채우는 createdAt·updatedAt이 코드의 한국 시각과 같은 기준이 되게
      TZ: Asia/Seoul
    ports:
      - "80:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

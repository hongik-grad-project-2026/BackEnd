services:
  backend:
    image: ${IMAGE_URI:?IMAGE_URI must be set}
    container_name: mulmi-backend
    restart: unless-stopped
    env_file:
      - path: /opt/mulmi/backend.env
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Development RDS has no migration history yet. Replace with migrations before production.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "80:8080"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

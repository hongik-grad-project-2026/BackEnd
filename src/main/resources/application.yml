# 스프링부트 공통 설정!
spring:
  application:
    name: mulmi-backend

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    path: /mulmi-api
  api-docs:
    path: /api-docs

server:
  port: ${SERVER_PORT:8080}

jwt:
  token:
    expiration:
      access: 14400000

app:
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:mulmi-dev-files-563586109665}

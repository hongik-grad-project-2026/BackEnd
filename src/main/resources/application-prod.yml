#EC2의 Docker에서 실행할 때의 스프링부트 설정
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: mulmi-backend

  # 대여 재고 문지기 (compose.deploy.yml의 redis 서비스, 같은 EC2·내부 네트워크)
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      # 명령 응답 대기 (기본 60초면 Redis가 멈출 때 신청이 1분씩 묶인다 → 실패하면 DB로 판단)
      timeout: 500ms
      connect-timeout: 1s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO

jwt:
  token:
    secret-key: ${JWT_TOKEN_SECRETKEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

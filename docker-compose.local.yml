services:
  db:
    image: mysql:8.0
    container_name: mulmi-mysql
    environment:
      MYSQL_DATABASE: mulmi
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - mulmi_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mulmi_mysql_data: